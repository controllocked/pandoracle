<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pandoracle product overview</title>
  <desc id="desc">A four-stage view of local source intake, immutable workspace storage, deterministic search planning, and provenance-rich results, with the optional Pandora encrypted removable-drive boundary shown below.</desc>
  <defs>
    <style>
      :root { --paper:#f5f3ee; --ink:#171a1d; --muted:#626a70; --line:#c7ccd0; --soft:#e8e7e2; --white:#fbfaf7; --accent:#4e6f80; --accent-soft:#dfe8eb; }
      text { font-family:"DejaVu Sans",Arial,sans-serif; fill:var(--ink); }
      .kicker { font-size:14px; font-weight:700; letter-spacing:2.4px; fill:var(--accent); }
      .title { font-size:42px; font-weight:700; letter-spacing:-1px; }
      .subtitle { font-size:19px; fill:var(--muted); }
      .stage { font-size:14px; font-weight:700; letter-spacing:1.5px; fill:var(--accent); }
      .head { font-size:24px; font-weight:700; }
      .body { font-size:16px; fill:var(--muted); }
      .small { font-size:13px; fill:var(--muted); }
      .mono { font-family:"DejaVu Sans Mono",monospace; font-size:13px; }
      .node { fill:var(--white); stroke:var(--line); stroke-width:1.5; }
      .accent-node { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
      .flow { fill:none; stroke:var(--ink); stroke-width:2; marker-end:url(#arrow); }
      .control { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:7 6; marker-end:url(#arrow-accent); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171a1d"/></marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e6f80"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c7ccd0" stroke-width="2"/></pattern>
  </defs>

  <rect width="1600" height="900" fill="#f5f3ee"/>
  <text x="80" y="72" class="kicker">PANDORACLE / SYSTEM MAP</text>
  <text x="80" y="126" class="title">Private data. Deterministic search. Verifiable results.</text>
  <text x="80" y="164" class="subtitle">Portable encrypted intelligence workspace for hunting across massive private datasets, with an OPSEC-first design.</text>

  <!-- restrained vector rendering of the supplied eye / cube mark -->
  <g transform="translate(1400 42) scale(.22)" aria-label="Pandoracle mark">
    <path d="M0 85L250 0L500 85L250 174Z" fill="#171a1d"/>
    <path d="M0 110L238 195V500L0 415Z" fill="#171a1d"/>
    <path d="M500 110L262 195V500L500 415Z" fill="#171a1d"/>
    <path d="M55 290Q250 145 445 290Q250 435 55 290Z" fill="#f5f3ee"/>
    <circle cx="250" cy="290" r="67" fill="#171a1d"/>
  </g>

  <line x1="80" y1="210" x2="1520" y2="210" stroke="#c7ccd0"/>

  <!-- stage 1 -->
  <text x="80" y="257" class="stage">01 / ACQUIRE</text>
  <text x="80" y="294" class="head">Heterogeneous sources</text>
  <rect x="80" y="326" width="260" height="64" rx="4" class="node"/>
  <text x="104" y="353" font-size="16" font-weight="700">Source bytes</text>
  <text x="104" y="376" class="small">CSV · TSV · structured exports</text>
  <rect x="80" y="406" width="260" height="64" rx="4" class="node"/>
  <text x="104" y="433" font-size="16" font-weight="700">Semantic confirmation</text>
  <text x="104" y="456" class="small">Meaning is explicit; inference is advisory</text>

  <!-- stage 2 -->
  <text x="420" y="257" class="stage">02 / PRESERVE</text>
  <text x="420" y="294" class="head">Immutable workspace</text>
  <rect x="420" y="326" width="300" height="144" rx="4" class="node"/>
  <text x="444" y="355" font-size="16" font-weight="700">Evidence &amp; records</text>
  <text x="444" y="384" class="mono">RAW / SHA-256</text>
  <text x="444" y="409" class="mono">DatasetVersion / Parquet</text>
  <text x="444" y="434" class="mono">CanonicalProfile / Parquet</text>
  <line x1="444" y1="449" x2="696" y2="449" stroke="#c7ccd0"/>
  <text x="444" y="466" class="small">Stable identity survives physical rebuilds</text>

  <!-- stage 3 -->
  <text x="800" y="257" class="stage">03 / HUNT</text>
  <text x="800" y="294" class="head">Deterministic planner</text>
  <rect x="800" y="326" width="300" height="144" rx="4" class="accent-node"/>
  <text x="824" y="355" font-size="16" font-weight="700">One semantic query contract</text>
  <text x="824" y="384" class="body">VALUE / TOKEN acceleration</text>
  <text x="824" y="410" class="body">or projected canonical scan</text>
  <text x="824" y="436" class="body">with bounded candidate sets</text>
  <text x="824" y="459" class="small">Candidates are always verified</text>

  <!-- stage 4 -->
  <text x="1180" y="257" class="stage">04 / VERIFY</text>
  <text x="1180" y="294" class="head">Complete results</text>
  <rect x="1180" y="326" width="340" height="144" rx="4" class="node"/>
  <text x="1204" y="355" font-size="16" font-weight="700">Original record + provenance</text>
  <text x="1204" y="384" class="mono">RecordRef(version, ordinal)</text>
  <text x="1204" y="410" class="body">source identity · match metadata</text>
  <text x="1204" y="436" class="body">original + canonical values</text>
  <text x="1204" y="459" class="small">Unranked · deterministic ordering</text>

  <path d="M340 398H396" class="flow"/>
  <path d="M720 398H776" class="flow"/>
  <path d="M1100 398H1156" class="flow"/>

  <text x="80" y="535" class="kicker">DEPLOYMENT BOUNDARY</text>
  <rect x="80" y="566" width="1440" height="238" rx="6" fill="#fbfaf7" stroke="#c7ccd0" stroke-width="1.5"/>
  <rect x="80" y="566" width="1440" height="44" rx="6" fill="#171a1d"/>
  <text x="104" y="594" font-size="15" font-weight="700" fill="#fbfaf7">OPTIONAL PANDORA DEVICE LAYER</text>
  <text x="1494" y="594" text-anchor="end" font-size="13" fill="#dfe8eb">ENCRYPTION AT REST</text>

  <rect x="112" y="642" width="232" height="118" rx="4" fill="url(#hatch)" stroke="#c7ccd0"/>
  <text x="136" y="676" font-size="17" font-weight="700">Public partition</text>
  <text x="136" y="704" class="mono">FAT32 / 64 MiB</text>
  <text x="136" y="732" class="small">Owner files + opaque device marker</text>

  <rect x="384" y="642" width="784" height="118" rx="4" class="accent-node"/>
  <text x="408" y="676" font-size="17" font-weight="700">Private partition</text>
  <text x="408" y="704" class="mono">LUKS2 → ext4 → workspace/</text>
  <text x="408" y="732" class="small">RAW · Parquet · catalog · accelerations · operation journals</text>

  <rect x="1208" y="642" width="280" height="118" rx="4" class="node"/>
  <text x="1232" y="676" font-size="17" font-weight="700">Path-based core</text>
  <text x="1232" y="704" class="body">Sees a mounted POSIX path</text>
  <text x="1232" y="732" class="small">No block device or credentials</text>

  <path d="M1168 701H1184" class="flow"/>
  <path d="M1348 642V516H950V486" class="control"/>
  <text x="1160" y="507" text-anchor="end" class="small">mounted workspace path</text>

  <text x="80" y="850" class="small">Local execution · no search server · no account · no network search path</text>
  <text x="1520" y="850" text-anchor="end" class="small">Pandora protects powered-off media; the active host remains trusted.</text>
</svg>
