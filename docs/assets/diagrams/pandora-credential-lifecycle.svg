<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Pandora credential topology and supervised session lifecycle</title>
  <desc id="desc">The left panel shows isolated LUKS credential roles and persistence. The right panel shows open, active, close, removal, and recovery states.</desc>
  <defs>
    <style>
      :root { --paper:#f5f3ee; --ink:#171a1d; --muted:#626a70; --line:#c7ccd0; --white:#fbfaf7; --accent:#4e6f80; --accent-soft:#dfe8eb; }
      text { font-family:"DejaVu Sans",Arial,sans-serif; fill:var(--ink); }
      .kicker { font-size:14px; font-weight:700; letter-spacing:2.4px; fill:var(--accent); }
      .title { font-size:38px; font-weight:700; letter-spacing:-.8px; }
      .subtitle { font-size:17px; fill:var(--muted); }
      .section { font-size:14px; font-weight:700; letter-spacing:1.5px; fill:var(--accent); }
      .head { font-size:17px; font-weight:700; }
      .body { font-size:13px; fill:var(--muted); }
      .tiny { font-size:11.5px; fill:var(--muted); }
      .mono { font-family:"DejaVu Sans Mono",monospace; font-size:12px; }
      .node { fill:var(--white); stroke:var(--line); stroke-width:1.5; }
      .accent-node { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
      .state { fill:var(--white); stroke:var(--ink); stroke-width:1.5; }
      .flow { fill:none; stroke:var(--ink); stroke-width:1.8; marker-end:url(#arrow); }
      .control { fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:7 6; marker-end:url(#arrow-accent); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#171a1d"/></marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4e6f80"/></marker>
  </defs>
  <rect width="1800" height="1050" fill="#f5f3ee"/>
  <text x="70" y="60" class="kicker">PANDORA / CREDENTIALS &amp; SESSION</text>
  <text x="70" y="108" class="title">Independent credentials. One supervised lifetime.</text>
  <text x="70" y="142" class="subtitle">No role collapses into a reusable secret; an active shell cannot outlive the mounted device session.</text>

  <!-- panels -->
  <rect x="70" y="190" width="720" height="772" rx="6" fill="#fbfaf7" stroke="#c7ccd0"/>
  <rect x="820" y="190" width="910" height="772" rx="6" fill="#fbfaf7" stroke="#c7ccd0"/>
  <text x="98" y="224" class="section">01 / CREDENTIAL TOPOLOGY</text>
  <text x="848" y="224" class="section">02 / SUPERVISED SESSION LIFECYCLE</text>

  <!-- keyslot spine -->
  <rect x="110" y="266" width="124" height="572" rx="5" fill="#171a1d"/>
  <text x="172" y="301" text-anchor="middle" font-size="15" font-weight="700" fill="#fbfaf7">LUKS2</text>
  <text x="172" y="326" text-anchor="middle" font-size="12" fill="#c7ccd0">KEYSLOTS</text>
  <circle cx="172" cy="398" r="27" fill="#fbfaf7"/><text x="172" y="404" text-anchor="middle" class="head">0</text>
  <circle cx="172" cy="548" r="27" fill="#fbfaf7"/><text x="172" y="554" text-anchor="middle" class="head">1</text>
  <rect x="145" y="674" width="54" height="72" rx="27" fill="#dfe8eb"/><text x="172" y="705" text-anchor="middle" class="head">2</text><text x="172" y="727" text-anchor="middle" class="tiny">…31</text>
  <text x="172" y="802" text-anchor="middle" font-size="11" fill="#c7ccd0">reserved roles</text>

  <rect x="292" y="338" width="450" height="120" rx="4" class="node"/>
  <text x="316" y="369" class="head">Main passphrase</text>
  <text x="316" y="397" class="body">Chosen by the user · normal manual unlock</text>
  <text x="316" y="424" class="mono">Persistence: never by Pandoracle</text>
  <path d="M234 398H280" class="flow"/>

  <rect x="292" y="488" width="450" height="120" rx="4" class="node"/>
  <text x="316" y="519" class="head">Recovery credential</text>
  <text x="316" y="547" class="body">Independent 256-bit Base32 · displayed once</text>
  <text x="316" y="574" class="mono">Persistence: offline, user-controlled</text>
  <path d="M234 548H280" class="flow"/>

  <rect x="292" y="638" width="450" height="144" rx="4" class="accent-node"/>
  <text x="316" y="669" class="head">Per-host keys</text>
  <text x="316" y="697" class="body">Independent 256-bit key per trusted host</text>
  <text x="316" y="724" class="mono">Persistence: that login's Secret Service</text>
  <text x="316" y="751" class="tiny">Revocable by removing its declared keyslot</text>
  <path d="M234 710H280" class="flow"/>

  <rect x="110" y="866" width="632" height="62" rx="4" class="accent-node"/>
  <text x="134" y="892" class="head">Compartment rule</text>
  <text x="134" y="916" class="body">Main ≠ recovery ≠ host key; each host key is distinct and fully capable of unlock.</text>

  <!-- session state machine -->
  <rect x="872" y="274" width="170" height="66" rx="33" class="state"/>
  <text x="957" y="314" text-anchor="middle" class="head">Detected</text>
  <rect x="1120" y="274" width="190" height="66" rx="4" class="state"/>
  <text x="1215" y="303" text-anchor="middle" class="head">Unlocking</text>
  <text x="1215" y="324" text-anchor="middle" class="tiny">host key or prompt</text>
  <rect x="1388" y="274" width="190" height="66" rx="4" class="state"/>
  <text x="1483" y="303" text-anchor="middle" class="head">Mounted</text>
  <text x="1483" y="324" text-anchor="middle" class="tiny">as invoking user</text>
  <path d="M1042 307H1108" class="flow"/><path d="M1310 307H1376" class="flow"/>

  <rect x="1388" y="400" width="190" height="76" rx="4" class="state"/>
  <text x="1483" y="430" text-anchor="middle" class="head">Validate / recover</text>
  <text x="1483" y="453" text-anchor="middle" class="tiny">strict binding + workspace</text>
  <path d="M1483 340V388" class="flow"/>

  <rect x="1108" y="400" width="202" height="76" rx="4" class="accent-node"/>
  <text x="1209" y="430" text-anchor="middle" class="head">Active shell</text>
  <text x="1209" y="453" text-anchor="middle" class="tiny">child process supervised</text>
  <path d="M1388 438H1322" class="flow"/>

  <rect x="872" y="400" width="160" height="76" rx="4" class="state"/>
  <text x="952" y="430" text-anchor="middle" class="head">Flush</text>
  <text x="952" y="453" text-anchor="middle" class="tiny">sync workspace</text>
  <path d="M1108 438H1044" class="flow"/>

  <rect x="872" y="550" width="160" height="70" rx="4" class="state"/>
  <text x="952" y="592" text-anchor="middle" class="head">Unmount</text>
  <rect x="1110" y="550" width="180" height="70" rx="4" class="state"/>
  <text x="1200" y="592" text-anchor="middle" class="head">Lock mapping</text>
  <rect x="1348" y="550" width="250" height="70" rx="35" class="state"/>
  <text x="1473" y="581" text-anchor="middle" class="head">Powered off</text>
  <text x="1473" y="603" text-anchor="middle" class="tiny">safe to remove</text>
  <path d="M952 476V538" class="flow"/><path d="M1032 585H1098" class="flow"/><path d="M1290 585H1336" class="flow"/>

  <!-- branches -->
  <rect x="872" y="694" width="276" height="96" rx="4" class="node"/>
  <text x="896" y="725" class="head">Busy unmount</text>
  <text x="896" y="752" class="body">Retry, or return to the active session.</text>
  <text x="896" y="775" class="tiny">Never claim safe removal early.</text>
  <path d="M952 620V682" class="control"/>
  <path d="M1148 742H1176V510H1209V488" class="control"/>

  <rect x="1208" y="694" width="470" height="96" rx="4" class="accent-node"/>
  <text x="1232" y="725" class="head">Physical removal / device disappearance</text>
  <text x="1232" y="752" class="body">Terminate the child shell and clear the supervised session.</text>
  <text x="1232" y="775" class="tiny">The next open validates and runs conservative recovery.</text>
  <path d="M1260 476V650H1443V682" class="control"/>

  <rect x="872" y="840" width="806" height="84" rx="4" fill="#f5f3ee" stroke="#c7ccd0"/>
  <text x="896" y="870" class="head">Lifecycle invariant</text>
  <text x="896" y="898" class="body">The shell is a child of the device session: clean close flushes → unmounts → locks; disappearance terminates access.</text>

  <text x="70" y="1012" class="tiny">Credentials travel in memory via pipes/FIFOs — not argv, environment variables or regular files.</text>
  <text x="1730" y="1012" text-anchor="end" class="tiny">Automatic unlock delegates trust to that host's login and Secret Service.</text>
</svg>
