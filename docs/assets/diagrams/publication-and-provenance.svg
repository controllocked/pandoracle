<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Pandoracle catalog-last publication and provenance</title>
  <desc id="desc">A publication timeline places the catalog commit after durable filesystem publication. A provenance graph separates authoritative evidence from replaceable derived layers.</desc>
  <defs>
    <style>
      :root { --paper:#f5f3ee; --ink:#171a1d; --muted:#626a70; --line:#c7ccd0; --white:#fbfaf7; --soft:#e8e7e2; --accent:#4e6f80; --accent-soft:#dfe8eb; }
      text { font-family:"DejaVu Sans",Arial,sans-serif; fill:var(--ink); }
      .kicker { font-size:14px; font-weight:700; letter-spacing:2.4px; fill:var(--accent); }
      .title { font-size:38px; font-weight:700; letter-spacing:-.8px; }
      .subtitle { font-size:17px; fill:var(--muted); }
      .section { font-size:13px; font-weight:700; letter-spacing:1.5px; fill:var(--accent); }
      .head { font-size:16px; font-weight:700; }
      .body { font-size:12.5px; fill:var(--muted); }
      .tiny { font-size:11px; fill:var(--muted); }
      .mono { font-family:"DejaVu Sans Mono",monospace; font-size:11.5px; }
      .node { fill:var(--white); stroke:var(--line); stroke-width:1.5; }
      .evidence { fill:var(--white); stroke:var(--ink); stroke-width:2; }
      .derived { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
      .flow { fill:none; stroke:var(--ink); stroke-width:1.7; marker-end:url(#arrow); }
      .derived-flow { fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:7 6; marker-end:url(#arrow-accent); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#171a1d"/></marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4e6f80"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c7ccd0" stroke-width="2"/></pattern>
  </defs>
  <rect width="1800" height="1100" fill="#f5f3ee"/>
  <text x="70" y="60" class="kicker">PANDORACLE / INTEGRITY &amp; PROVENANCE</text>
  <text x="70" y="108" class="title">Filesystem first. Catalog last.</text>
  <text x="70" y="142" class="subtitle">Files become durable before one SQLite transaction makes the new version visible. Search results trace back to exact source bytes.</text>

  <!-- publication timeline -->
  <rect x="70" y="184" width="1660" height="394" rx="6" fill="#fbfaf7" stroke="#c7ccd0"/>
  <text x="94" y="215" class="section">01 / PUBLICATION TIMELINE</text>
  <text x="1620" y="215" text-anchor="end" class="tiny">TIME →</text>
  <line x1="142" y1="244" x2="1660" y2="244" stroke="#c7ccd0"/>
  <line x1="142" y1="320" x2="1660" y2="320" stroke="#c7ccd0"/>
  <line x1="142" y1="396" x2="1660" y2="396" stroke="#c7ccd0"/>
  <line x1="142" y1="472" x2="1660" y2="472" stroke="#c7ccd0"/>
  <line x1="142" y1="548" x2="1660" y2="548" stroke="#c7ccd0"/>
  <text x="94" y="286" class="section">SOURCE</text>
  <text x="94" y="362" class="section">STAGING</text>
  <text x="94" y="438" class="section">FINAL FS</text>
  <text x="94" y="514" class="section">CATALOG</text>

  <rect x="220" y="258" width="198" height="44" rx="3" class="node"/>
  <text x="319" y="285" text-anchor="middle" class="head">Hash + copy RAW</text>
  <rect x="466" y="334" width="218" height="44" rx="3" class="node"/>
  <text x="575" y="361" text-anchor="middle" class="head">Transform streams</text>
  <rect x="732" y="334" width="182" height="44" rx="3" class="node"/>
  <text x="823" y="361" text-anchor="middle" class="head">Validate</text>
  <rect x="962" y="334" width="188" height="44" rx="3" class="node"/>
  <text x="1056" y="361" text-anchor="middle" class="head">fsync artifacts</text>
  <rect x="1198" y="410" width="206" height="44" rx="3" class="node"/>
  <text x="1301" y="437" text-anchor="middle" class="head">Atomic rename</text>
  <rect x="1450" y="486" width="190" height="44" rx="3" class="derived"/>
  <text x="1545" y="513" text-anchor="middle" class="head">Catalog transaction</text>

  <path d="M418 280H442V356H454" class="flow"/>
  <path d="M684 356H720" class="flow"/><path d="M914 356H950" class="flow"/>
  <path d="M1150 356H1174V432H1186" class="flow"/>
  <path d="M1404 432H1428V508H1438" class="flow"/>

  <line x1="1430" y1="232" x2="1430" y2="558" stroke="#4e6f80" stroke-width="2.5"/>
  <text x="1414" y="251" text-anchor="end" class="section">COMMIT POINT</text>
  <text x="1414" y="272" text-anchor="end" class="tiny">active-pointer switch</text>
  <rect x="220" y="548" width="1180" height="20" fill="url(#hatch)"/>
  <text x="810" y="566" text-anchor="middle" class="tiny">Crash anywhere here → prior active version remains authoritative</text>
  <text x="1450" y="558" class="tiny">After commit → complete new version is active</text>

  <!-- provenance graph -->
  <rect x="70" y="606" width="1160" height="420" rx="6" fill="#fbfaf7" stroke="#c7ccd0"/>
  <text x="94" y="637" class="section">02 / PROVENANCE GRAPH</text>

  <rect x="110" y="682" width="205" height="76" rx="4" class="evidence"/>
  <text x="130" y="711" class="head">RAW object</text>
  <text x="130" y="738" class="mono">source_sha256</text>
  <rect x="388" y="672" width="230" height="96" rx="4" class="evidence"/>
  <text x="408" y="701" class="head">DatasetVersion</text>
  <text x="408" y="727" class="mono">immutable identity</text>
  <text x="408" y="751" class="body">accepted ordinal order</text>
  <rect x="690" y="682" width="208" height="76" rx="4" class="evidence"/>
  <text x="710" y="711" class="head">Record Parquet</text>
  <text x="710" y="738" class="body">original accepted values</text>
  <path d="M315 720H376" class="flow"/><path d="M618 720H678" class="flow"/>

  <rect x="388" y="824" width="230" height="76" rx="4" class="node"/>
  <text x="408" y="853" class="head">SemanticSchema</text>
  <text x="408" y="880" class="body">confirmed field meaning</text>
  <rect x="690" y="824" width="208" height="76" rx="4" class="derived"/>
  <text x="710" y="853" class="head">CanonicalProfile</text>
  <text x="710" y="880" class="body">versioned comparison contract</text>
  <rect x="970" y="682" width="220" height="76" rx="4" class="derived"/>
  <text x="990" y="711" class="head">Canonical Parquet</text>
  <text x="990" y="738" class="body">aligned search values</text>
  <rect x="970" y="824" width="220" height="76" rx="4" class="derived"/>
  <text x="990" y="853" class="head">AccelerationProfile</text>
  <text x="990" y="880" class="body">VALUE / TOKEN postings</text>
  <path d="M503 768V812" class="flow"/>
  <path d="M618 862H678" class="derived-flow"/>
  <path d="M898 862H958" class="derived-flow"/>
  <path d="M898 720H958" class="derived-flow"/>
  <path d="M1078 824V770" class="derived-flow"/>

  <rect x="388" y="940" width="230" height="56" rx="4" class="node"/>
  <text x="503" y="974" text-anchor="middle" class="mono">RecordRef(version, ordinal)</text>
  <path d="M503 768V928" class="flow"/>
  <rect x="690" y="932" width="500" height="72" rx="4" class="derived"/>
  <text x="714" y="961" class="head">SearchResult</text>
  <text x="714" y="987" class="body">complete original record · exact source · match metadata · access path</text>
  <path d="M618 968H678" class="flow"/>
  <path d="M794 758V920" class="flow"/>

  <!-- recovery / GC inset -->
  <rect x="1260" y="606" width="470" height="420" rx="6" fill="#fbfaf7" stroke="#c7ccd0"/>
  <text x="1284" y="637" class="section">03 / RECOVERY &amp; GC</text>
  <rect x="1300" y="680" width="176" height="58" rx="4" class="node"/>
  <text x="1388" y="715" text-anchor="middle" class="head">Interrupted staging</text>
  <rect x="1514" y="680" width="176" height="58" rx="4" class="node"/>
  <text x="1602" y="705" text-anchor="middle" class="head">ABORTED / FAILED</text>
  <text x="1602" y="726" text-anchor="middle" class="tiny">audit tombstone</text>
  <path d="M1476 709H1502" class="flow"/>
  <rect x="1300" y="776" width="390" height="58" rx="4" class="node"/>
  <text x="1495" y="801" text-anchor="middle" class="head">operations/orphans/</text>
  <text x="1495" y="822" text-anchor="middle" class="tiny">quarantine first; never infer publication</text>
  <path d="M1388 738V764" class="flow"/>

  <rect x="1300" y="880" width="112" height="58" rx="4" class="node"/>
  <text x="1356" y="914" text-anchor="middle" class="head">Candidate</text>
  <rect x="1442" y="880" width="112" height="58" rx="4" class="node"/>
  <text x="1498" y="914" text-anchor="middle" class="head">Trash</text>
  <rect x="1584" y="880" width="106" height="58" rx="4" class="derived"/>
  <text x="1637" y="904" text-anchor="middle" class="head">Catalog</text>
  <text x="1637" y="925" text-anchor="middle" class="tiny">commit</text>
  <path d="M1412 909H1430" class="flow"/><path d="M1554 909H1572" class="flow"/>
  <path d="M1637 938V972H1498V950" class="derived-flow"/>
  <text x="1567" y="994" text-anchor="middle" class="tiny">delete bytes only after commit</text>

  <line x1="70" y1="1054" x2="1730" y2="1054" stroke="#c7ccd0"/>
  <text x="70" y="1080" class="tiny">Dark outline = durable evidence / identity</text>
  <text x="338" y="1080" class="tiny">Blue-gray = replaceable derived layer or commit authority</text>
  <text x="1730" y="1080" text-anchor="end" class="tiny">Search acceleration is disposable; provenance is not.</text>
</svg>
