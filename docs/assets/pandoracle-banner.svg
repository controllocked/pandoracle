<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pandoracle</title>
  <desc id="desc">Private, provenance-first search for local datasets</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="190" cy="180" r="118" fill="none" stroke="#29304d" stroke-width="2"/>
  <circle cx="190" cy="180" r="88" fill="#11172b" stroke="url(#accent)" stroke-width="5"/>
  <path d="M112 180c21-36 47-54 78-54s57 18 78 54c-21 36-47 54-78 54s-57-18-78-54Z" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="190" cy="180" r="27" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="190" cy="180" r="9" fill="#f8fafc"/>
  <path d="M190 79v-22M190 303v-22M89 180H67M313 180h-22" stroke="#687397" stroke-width="4" stroke-linecap="round"/>
  <text x="360" y="168" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="78" font-weight="700">Pandoracle</text>
  <text x="364" y="220" fill="#aeb8d4" font-family="DejaVu Sans, sans-serif" font-size="25" letter-spacing="0.4">PRIVATE · OFFLINE · PROVENANCE-FIRST</text>
  <rect x="364" y="250" width="520" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
</svg>
