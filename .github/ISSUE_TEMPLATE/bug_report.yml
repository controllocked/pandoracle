name: Bug report
description: Report a reproducible problem in Pandoracle
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove all real records,
        queries, credentials, device identifiers, and workspace paths first.
  - type: input
    id: version
    attributes:
      label: Pandoracle version
      placeholder: "pandoracle --version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, desktop, Python version, and install method
      placeholder: Fedora 43, GNOME, Python 3.14, uv tool
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use deterministic synthetic data and list exact commands.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Paste concise output with all sensitive values removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed personal data, secrets, recovery material, and device identifiers.
          required: true
